<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos Architect | Tactical Time-Step</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="game-container">
        <div id="time-overlay"></div>

        <div id="key-display" class="hidden">Chaves: 0/0</div>

        <div id="hud">
            <div class="hud-item">
                <span class="label">Fase</span>
                <span id="level-display" class="value">01</span>
            </div>
            <div class="hud-item">
                <span class="label">Sonda de Luz</span>
                <div class="energy-container">
                    <div id="energy-fill"></div>
                </div>
            </div>
            <div class="hud-item">
                <span class="label">Estado</span>
                <span id="time-state" class="value">TEMPO REAL</span>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="screen-overlay">
            <h1>Chronos Architect</h1>
            <p style="margin-bottom: 30px; letter-spacing: 2px; opacity: 0.8;">O tempo move-se quando você se move.</p>
            <button class="btn" onclick="game.start()">Iniciar Protocolo</button>
        </div>

        <!-- Level Clear Screen -->
        <div id="clear-screen" class="screen-overlay hidden">
            <h1 style="color: var(--energy-color);">Nível Concluído</h1>
            <button class="btn" onclick="game.nextLevel()">Próximo Nível</button>
        </div>

        <!-- Game Over Screen -->
        <div id="death-screen" class="screen-overlay hidden">
            <h1 style="color: var(--enemy-color);">Conexão Perdida</h1>
            <button class="btn" onclick="game.restartLevel()">Tentar Novamente</button>
        </div>
    </div>

    <!-- Main Game Logic -->
    <script src="game.js"></script>
</body>

</html>
